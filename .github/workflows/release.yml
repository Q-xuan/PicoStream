name: release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '要打的 tag，例如 v0.1.0。留空则按最新 tag 自动 +patch'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: pick
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [ "$EVENT" = pull_request ]; then
            tag="pr-${GITHUB_SHA::7}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            tag="$INPUT_VERSION"
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "version must be vX.Y.Z" >&2
              exit 1
            fi
          else
            latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
            if [ -z "$latest" ]; then
              tag=v0.1.0
            else
              ver="${latest#v}"
              maj="${ver%%.*}"
              rest="${ver#*.}"
              min="${rest%%.*}"
              pat="${rest#*.}"
              tag="v${maj}.${min}.$((pat + 1))"
            fi
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag ${tag}"

          [ "$EVENT" = pull_request ] && exit 0

          if git rev-parse "$tag" >/dev/null 2>&1; then
            existing="$(git rev-list -n1 "$tag")"
            head="$(git rev-parse HEAD)"
            if [ "$existing" != "$head" ]; then
              echo "tag ${tag} already points at ${existing}, not ${head}" >&2
              exit 1
            fi
            echo "tag exists on HEAD"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/${tag}"

  package:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p _site dist
          cp index.html picostream.css _site/
          cp -r prototype _site/prototype
          zip -X -j "dist/picostream-${TAG}.zip" picostream.css README.md DESIGN.md LICENSE
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          fi
          npm pack --pack-destination dist
          unzip -l "dist/picostream-${TAG}.zip"
          tar -tzf dist/picostream-*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: picostream-${{ needs.tag.outputs.tag }}
          path: dist/picostream-*

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  release:
    needs: [tag, package]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: picostream-${{ needs.tag.outputs.tag }}
          path: dist

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/picostream-*.zip dist/picostream-*.tgz)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes --verify-tag
          fi

  npm:
    needs: [tag, package]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - env:
          TAG: ${{ needs.tag.outputs.tag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          npm version "$ver" --no-git-tag-version --allow-same-version

          if npm view "picostream@${ver}" version >/dev/null 2>&1; then
            echo "picostream@${ver} already on npm"
            exit 0
          fi

          if [ -n "${NPM_TOKEN:-}" ]; then
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public
            exit 0
          fi

          if npm view picostream name >/dev/null 2>&1; then
            npm publish --access public --provenance
            exit 0
          fi

          echo "::warning::picostream is not on npm yet. First publish from an npm account: npm login && npm publish --access public"
          echo "Then npmjs.com → picostream → Trusted Publisher → GitHub Actions"
          echo "  owner Q-xuan  repo PicoStream  workflow release.yml  allow publish"

  pages:
    needs: [tag, package]
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
