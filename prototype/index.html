<!DOCTYPE html>
<html lang="zh-CN" class="wet-page">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wetink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../wetink.css" />
  <style>
    main { padding: 2.5rem 0 5rem; }
    h1 {
      margin: 0 0 0.35rem;
      font-family: var(--wet-serif);
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--wet-ink);
    }
    .lede {
      margin: 0 0 2.5rem;
      font-family: var(--wet-serif);
      font-size: 1.05rem;
    }
    h2.wet-label {
      margin: 2.75rem 0 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--wet-ink);
    }
    .note { margin: 0 0 1.25rem; }
    .row { display: flex; gap: 1rem; margin: 0 0 1rem; }
    .nav, .row button, .nav a {
      display: flex;
      gap: 1rem;
      font-size: 0.875rem;
    }
    .nav a { color: var(--wet-muted); text-decoration: none; }
    .nav a:hover { color: var(--wet-ink); }
    .nav button, .row button {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      font: inherit;
      color: var(--wet-muted);
      cursor: pointer;
    }
    .row button {
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-color: var(--wet-faint);
    }
    .nav button[aria-pressed="true"],
    .nav button:hover,
    .row button:hover { color: var(--wet-ink); }
    .grid { display: grid; gap: 1.75rem; }
    footer { padding: 1.25rem 0 2rem; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header class="wet-banner wet-shell">
    <strong>wetink</strong>
    <div class="nav">
      <a href="harness.html">harness</a>
      <button type="button" id="to-light" aria-pressed="true">light</button>
      <button type="button" id="to-dark" aria-pressed="false">dark</button>
      <button type="button" id="to-zh" aria-pressed="true">zh</button>
      <button type="button" id="to-en" aria-pressed="false">en</button>
    </div>
  </header>

  <main class="wet-shell">
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>

    <h2 class="wet-label" data-i18n="sessionLabel"></h2>
    <p class="note" data-i18n="sessionNote"></p>
    <div class="row">
      <button type="button" id="replay" data-i18n="replay"></button>
      <button type="button" id="cut" data-i18n="cut"></button>
    </div>
    <div class="wet-thread" id="session"></div>

    <h2 class="wet-label" data-i18n="specLabel"></h2>
    <p class="note" data-i18n="specNote"></p>
    <div class="grid">
      <section class="wet-turn" data-role="assistant" data-stream="thinking">
        <p class="wet-meta" data-i18n="plaque.think"></p>
        <details class="wet-think">
          <summary><span data-i18n="spec.thinkPeek"></span><span class="wet-caret" aria-hidden="true"></span></summary>
          <p data-i18n="spec.thinkBody"></p>
        </details>
      </section>

      <section class="wet-turn" data-role="assistant" data-stream="typing">
        <p class="wet-meta" data-i18n="plaque.write"></p>
        <p class="wet-voice" data-tail><span data-i18n="spec.write"></span><span class="wet-caret" aria-hidden="true"></span></p>
      </section>

      <section class="wet-turn" data-role="assistant" data-stream="tool">
        <p class="wet-meta" data-i18n="plaque.tool"></p>
        <details class="wet-think">
          <summary data-i18n="spec.toolPeek"></summary>
          <p data-i18n="spec.toolBody"></p>
        </details>
        <div class="wet-tools">
          <details class="wet-tool" data-kind="read" data-state="done">
            <summary><b>read</b> · DESIGN.md</summary>
            <pre class="wet-code">token · stream · tool</pre>
          </details>
          <details class="wet-tool" data-kind="read" data-state="done">
            <summary><b>read</b> · README.md</summary>
          </details>
          <details class="wet-tool" data-kind="read" data-state="running">
            <summary><b>read</b> · wetink.css<span class="wet-caret" aria-hidden="true"></span></summary>
          </details>
        </div>
      </section>

      <section class="wet-turn" data-role="assistant" data-stream="settled">
        <p class="wet-meta" data-i18n="plaque.done"></p>
        <div class="wet-voice">
          <h3 data-i18n="spec.settledHead"></h3>
          <p data-i18n="spec.settledBody"></p>
          <ul>
            <li data-i18n="spec.settledOld"></li>
            <li data-i18n="spec.settledWet"></li>
          </ul>
          <div class="wet-tools">
            <details class="wet-tool" data-kind="read" data-state="done">
              <summary><b>read</b> · DESIGN.md</summary>
              <pre class="wet-code">token · stream · tool · code · error</pre>
            </details>
            <details class="wet-tool" data-kind="write" data-state="done">
              <summary><b>write</b> · wetink.css</summary>
            </details>
          </div>
          <pre class="wet-code" data-lang="css">[data-stream="settled"] .wet-voice { color: var(--wet-muted); }</pre>
        </div>
      </section>

      <section class="wet-turn" data-role="assistant" data-stream="steer">
        <p class="wet-meta" data-i18n="plaque.steer"></p>
        <p class="wet-voice" data-i18n="spec.steer"></p>
      </section>

      <section class="wet-turn" data-role="assistant" data-stream="error">
        <p class="wet-meta" data-i18n="plaque.break"></p>
        <p class="wet-voice" data-i18n="spec.break"></p>
      </section>
    </div>
  </main>

  <footer class="wet-shell"><span data-i18n="footerLead"></span> <code>wetink.css</code> <span data-i18n="footerTail"></span></footer>

  <script>
    const I18N = {
      zh: {
        pageTitle: "wetink",
        title: "石上墨迹",
        lede: "粉墙黛瓦上的流式体感。思考折起一行，湿着用 caret。朱红是游廊，青紫是断口，改口走黛。",
        sessionLabel: "回合",
        sessionNote: "思 → 器 → 写 → 毕。打断走断口。改口不是断。",
        replay: "重放",
        cut: "打断",
        specLabel: "标本",
        specNote: "短匾。属性仍是英文，眼睛看的是这些字。",
        footerLead: "引入",
        footerTail: "· 无构建",
        "plaque.ask": "问",
        "plaque.reply": "答",
        "plaque.think": "思",
        "plaque.write": "写",
        "plaque.tool": "器",
        "plaque.done": "毕",
        "plaque.steer": "改",
        "plaque.break": "断",
        "spec.thinkPeek": "先读 DESIGN.md。确认五状态还够不够。思考链是题跋，不是第二篇正文。",
        "spec.thinkBody": "先读 DESIGN.md。确认五状态还够不够。思考链是题跋，不是第二篇正文。折起始终一行。",
        "spec.write": "眼睛跟着最后一个字。",
        "spec.toolPeek": "先读文件，再决定写什么。",
        "spec.toolBody": "连续 read 不该各立一根栏。包进同一条器。",
        "spec.settledHead": "干墨之后",
        "spec.settledBody": "题额仍是满墨。正文退一级。代码是窗洞，比墙更深，不是双边框。",
        "spec.settledOld": "旧回合保持毕",
        "spec.settledWet": "只有当前回合可以湿",
        "spec.steer": "用户改口。栏仍是实线黛，不是断。",
        "spec.break": "已打断。栏是虚线，色走青紫，不跟朱红游廊抢。",
        "play.ask": "读方案，抽出本地 agent 能直接引入的流式 CSS。要有思考、工具、代码和错误。",
        "play.thinkWet": "先读 DESIGN.md。确认五状态还够不够。思考链是题跋，不是第二篇正文。",
        "play.thinkDry": "五状态够用。思考链折成一行，不新开主题。",
        "play.spoken": "交付物是一份 CSS。本地 agent 只打 data-role 和 data-stream。思考链用弱墨，工具是石上刻痕，代码块不另开皮肤。",
        "play.cut": "已打断。栏是虚线，色走青紫，不跟朱红游廊抢。"
      },
      en: {
        pageTitle: "wetink",
        title: "Ink on Stone",
        lede: "Streaming on plaster and ink. Thought stays one folded line; wet uses the caret. Live is cinnabar. Break is violet. Steer is ink.",
        sessionLabel: "Turn",
        sessionNote: "Think → tool → write → done. Cut is a break. Steer is not.",
        replay: "Replay",
        cut: "Cut",
        specLabel: "Specimens",
        specNote: "Plaques. Attributes stay English. Eyes read these words.",
        footerLead: "Drop in",
        footerTail: "· no build",
        "plaque.ask": "Ask",
        "plaque.reply": "Reply",
        "plaque.think": "Think",
        "plaque.write": "Write",
        "plaque.tool": "Tool",
        "plaque.done": "Done",
        "plaque.steer": "Steer",
        "plaque.break": "Break",
        "spec.thinkPeek": "Read DESIGN.md. Check if five states are enough. Thought is a colophon, not a second essay.",
        "spec.thinkBody": "Read DESIGN.md. Check if five states are enough. Thought is a colophon, not a second essay. Folded thought stays one line.",
        "spec.write": "The eye follows the last glyph.",
        "spec.toolPeek": "Read the files, then decide what to write.",
        "spec.toolBody": "Consecutive reads should not each own a rail. Fold them into one tool stack.",
        "spec.settledHead": "After the ink dries",
        "spec.settledBody": "The title stays full ink. Body steps down. Code is a window well, deeper than the wall, not a double frame.",
        "spec.settledOld": "Old turns stay done",
        "spec.settledWet": "Only the current turn may stay wet",
        "spec.steer": "The user steered. The rail stays solid ink. It is not a break.",
        "spec.break": "Cut. The rail is dashed violet. It does not fight the cinnabar.",
        "play.ask": "Read the spec. Extract streaming CSS a local agent can import. Need thought, tools, code, and error.",
        "play.thinkWet": "Read DESIGN.md. Check if five states are enough. Thought is a colophon, not a second essay.",
        "play.thinkDry": "Five states are enough. Fold the chain. Do not open a new theme.",
        "play.spoken": "The deliverable is one CSS file. A local agent only sets data-role and data-stream. Thought stays faint. Tools are carved marks. Code does not get its own skin.",
        "play.cut": "Cut. The rail is dashed violet. It does not fight the cinnabar."
      }
    };

    const root = document.documentElement;
    const lightBtn = document.getElementById("to-light");
    const darkBtn = document.getElementById("to-dark");
    const zhBtn = document.getElementById("to-zh");
    const enBtn = document.getElementById("to-en");
    const query = () => new URLSearchParams(location.search);
    let lang = "zh";

    function t(key) {
      return (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;
    }

    function paint(dark) {
      const freeze = document.createElement("style");
      freeze.textContent = "*{transition:none!important}";
      document.head.appendChild(freeze);
      root.classList.toggle("dark", dark);
      lightBtn.setAttribute("aria-pressed", String(!dark));
      darkBtn.setAttribute("aria-pressed", String(dark));
      window.getComputedStyle(freeze).opacity;
      freeze.remove();
    }

    function applyLang(next) {
      lang = next === "en" ? "en" : "zh";
      root.lang = lang === "en" ? "en" : "zh-CN";
      document.title = t("pageTitle");
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      zhBtn.setAttribute("aria-pressed", String(lang === "zh"));
      enBtn.setAttribute("aria-pressed", String(lang === "en"));
    }

    function setParam(key, value) {
      const url = new URL(location.href);
      url.searchParams.set(key, value);
      history.replaceState(null, "", url);
    }

    function pickLang() {
      const q = query().get("lang");
      if (q === "en" || q === "zh") return q;
      return (navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh" : "en";
    }

    lightBtn.onclick = () => {
      setParam("theme", "light");
      paint(false);
    };
    darkBtn.onclick = () => {
      setParam("theme", "dark");
      paint(true);
    };
    zhBtn.onclick = () => {
      setParam("lang", "zh");
      applyLang("zh");
      play();
    };
    enBtn.onclick = () => {
      setParam("lang", "en");
      applyLang("en");
      play();
    };

    const themeQ = query().get("theme");
    paint(themeQ === "dark" || (themeQ !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches));
    applyLang(pickLang());

    const session = document.getElementById("session");
    let timer = 0;
    let cut = false;
    let gen = 0;

    function later(ms) {
      return new Promise((resolve) => {
        timer = setTimeout(resolve, ms);
      });
    }

    function clauses(full) {
      return full.split(/(?<=[。．.!?！？])\s*/).filter(Boolean);
    }

    function mount() {
      session.innerHTML = `
        <section class="wet-turn" data-role="user">
          <p class="wet-meta">${t("plaque.ask")}</p>
          <p class="wet-voice">${t("play.ask")}</p>
        </section>
        <section class="wet-turn" data-role="assistant" data-stream="thinking" id="bot">
          <p class="wet-meta">${t("plaque.reply")}</p>
          <details class="wet-think" id="reason" hidden>
            <summary id="peek"></summary>
            <p id="reason-body"></p>
          </details>
          <div class="wet-tools" id="tools" hidden></div>
          <div class="wet-voice" id="voice"></div>
          <span class="wet-caret" aria-hidden="true"></span>
        </section>`;
    }

    async function play() {
      const mine = ++gen;
      clearTimeout(timer);
      cut = false;
      mount();
      const bot = document.getElementById("bot");
      const reason = document.getElementById("reason");
      const peek = document.getElementById("peek");
      const reasonBody = document.getElementById("reason-body");
      const tools = document.getElementById("tools");
      const voice = document.getElementById("voice");
      const caret = bot.querySelector(":scope > .wet-caret");
      const spoken = t("play.spoken");

      function think(full) {
        reason.hidden = false;
        reason.classList.add("wet-enter");
        reason.open = false;
        const parts = clauses(full);
        peek.textContent = parts.slice(-1).join(lang === "en" ? " " : "");
        reasonBody.textContent = full;
      }

      const gone = () => cut || mine !== gen;
      await later(700);
      if (gone()) return;
      think(t("play.thinkWet"));
      peek.appendChild(caret);

      await later(500);
      if (gone()) return;
      bot.dataset.stream = "tool";
      bot.dataset.state = "running";
      tools.hidden = false;
      const read = document.createElement("details");
      read.className = "wet-tool wet-enter";
      read.dataset.kind = "read";
      read.dataset.state = "running";
      read.open = true;
      read.innerHTML = "<summary><b>read</b> · DESIGN.md</summary>";
      tools.appendChild(read);
      read.querySelector("summary").appendChild(caret);

      await later(550);
      if (gone()) return;
      read.dataset.state = "done";
      await later(400);
      if (gone()) return;
      read.open = false;
      read.insertAdjacentHTML("beforeend", '<pre class="wet-code">token · stream · tool · code · error</pre>');

      const read2 = document.createElement("details");
      read2.className = "wet-tool wet-enter";
      read2.dataset.kind = "read";
      read2.dataset.state = "running";
      read2.open = true;
      read2.innerHTML = "<summary><b>read</b> · README.md</summary>";
      tools.appendChild(read2);
      read2.querySelector("summary").appendChild(caret);

      await later(450);
      if (gone()) return;
      read2.dataset.state = "done";
      await later(400);
      if (gone()) return;
      read2.open = false;

      const write = document.createElement("details");
      write.className = "wet-tool wet-enter";
      write.dataset.kind = "write";
      write.dataset.state = "running";
      write.open = true;
      write.innerHTML = "<summary><b>write</b> · wetink.css</summary>";
      tools.appendChild(write);
      write.querySelector("summary").appendChild(caret);

      await later(550);
      if (gone()) return;
      write.dataset.state = "done";
      await later(400);
      if (gone()) return;
      write.open = false;
      delete bot.dataset.state;
      bot.dataset.stream = "typing";
      think(t("play.thinkDry"));

      const p = document.createElement("p");
      p.dataset.tail = "";
      voice.appendChild(p);
      p.appendChild(caret);

      for (let i = 1; i <= spoken.length; i += 1) {
        if (gone()) return;
        p.insertBefore(document.createTextNode(spoken.slice(i - 1, i)), caret);
        await later(14 + Math.random() * 22);
      }

      if (gone()) return;
      const fence = document.createElement("pre");
      fence.className = "wet-code wet-enter";
      fence.dataset.lang = "html";
      fence.dataset.tail = "";
      fence.textContent = '<section class="wet-turn" data-role="assistant" data-stream="typing">';
      delete p.dataset.tail;
      voice.appendChild(fence);

      await later(400);
      if (gone()) return;
      caret.remove();
      bot.querySelectorAll("[data-tail]").forEach((n) => delete n.dataset.tail);
      bot.dataset.stream = "settled";
    }

    function interrupt() {
      cut = true;
      clearTimeout(timer);
      const bot = document.getElementById("bot");
      if (!bot) return;
      bot.dataset.stream = "error";
      delete bot.dataset.state;
      const voice = document.getElementById("voice");
      if (voice && !voice.textContent.trim()) {
        voice.innerHTML = "<p>" + t("play.cut") + "</p>";
      }
      bot.querySelectorAll(".wet-caret").forEach((n) => n.remove());
    }

    document.getElementById("replay").onclick = play;
    document.getElementById("cut").onclick = interrupt;
    play();
    if (query().get("cut") === "1") {
      setTimeout(interrupt, 900);
    }
  </script>
</body>
</html>
